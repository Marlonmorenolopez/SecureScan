# ============================================================
# SecureScan Pro v3.0 — docker-compose.yml
# CORRECCIONES APLICADAS:
#  1. Añadido servicio frontend (Next.js) — todo arranca con un solo comando
#  2. api ya NO depende de msfrpcd con service_healthy (era frágil, lo bloqueaba)
#  3. sqlmapapi usa image: de la API ya construida en vez de rebuild completo
#  4. ALLOWED_ORIGINS incluye la red interna de Docker (frontend container)
#  5. MYSQL healthcheck usa variable en vez de contraseña hardcodeada
#  6. Volumen nuclei-templates apunta al path correcto del Dockerfile
#  7. Timeout gunicorn subido a 3600s para escaneos largos (variable de entorno)
#  8. api depende de msfrpcd con service_started (no service_healthy) para no bloquear
# ============================================================

services:

  # ── Frontend Next.js ─────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_TOKEN: ${API_TOKEN:-}
        NEXT_PUBLIC_API_URL: http://localhost:5000
        BACKEND_URL: http://api:5000
    container_name: securescan-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - NEXT_PUBLIC_API_TOKEN=${API_TOKEN:-}
      - BACKEND_URL=http://api:5000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - securescan-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ── Backend API Flask ────────────────────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: securescan-api
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - PORT=5000
      - SECRET_KEY=${SECRET_KEY:-dev-key-change-in-production}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme-redis-password}@redis:6379/0
      - TZ=America/Bogota
      - ZAP_API_URL=http://zap:8080
      - SQLMAP_API_URL=http://sqlmapapi:8775
      - ZAP_API_KEY=${ZAP_API_KEY:-securescan-dev-key-2024}
      # Timeouts (segundos)
      - SCAN_TIMEOUT_ZAP=1200
      - SCAN_TIMEOUT_NMAP=300
      - SCAN_TIMEOUT_GOBUSTER=300
      - SCAN_TIMEOUT_NUCLEI=1200
      - SCAN_TIMEOUT_SQLMAP=600
      - SCAN_TIMEOUT_PATATOR=180
      - SCAN_TIMEOUT_FFUF=300
      - SCAN_TIMEOUT_WAPPALYZER=60
      - SCAN_TIMEOUT_SEARCHSPLOIT=120
      - SCAN_TIMEOUT_METASPLOIT=900
      # Gunicorn timeout — debe ser mayor al timeout de escaneo más largo
      - GUNICORN_TIMEOUT=3600
      - ALLOWED_LAB_TARGETS=juice-shop:3000,dvwa:80,webgoat:8080
      - RESTRICT_TO_LAB_TARGETS=false
      - LOG_LEVEL=INFO
      # BUG FIX: incluir el servicio frontend en ALLOWED_ORIGINS
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000
      - API_TOKEN=${API_TOKEN:-}
      - MSF_HOST=msfrpcd
      - MSF_PORT=55553
      - MSF_PASSWORD=${MSF_PASSWORD:-msf}
      # SQLMap
      - SQLMAP_LEVEL=3
      - SQLMAP_RISK=2
      - SQLMAP_THREADS=5
      # Gobuster
      - GOBUSTER_THREADS=20
      - GOBUSTER_DELAY_MS=0
      # ZAP Spider
      - ZAP_SPIDER_MAX_CHILDREN=50
    depends_on:
      redis:
        condition: service_healthy
      zap:
        condition: service_started
      # BUG FIX: cambiado de service_healthy a service_started
      # Metasploit puede tardar >5 minutos en arrancar — no bloquear la API
      msfrpcd:
        condition: service_started
    volumes:
      - ./server:/app
      - scan-reports:/app/reports
      # BUG FIX: path correcto del Dockerfile (nuclei-templates, no .config/nuclei)
      - nuclei-templates:/home/scanner/nuclei-templates
      - /dev/shm:/dev/shm
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "132"
    networks:
      - securescan-net
      - lab-net
    cap_add:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: securescan-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme-redis-password}
      --save 60 1
      --loglevel warning
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - securescan-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme-redis-password}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── OWASP ZAP ────────────────────────────────────────────────────────
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: securescan-zap
    ports:
      - "8080:8080"
    environment:
      - ZAP_API_KEY=${ZAP_API_KEY:-securescan-dev-key-2024}
    command: >
      zap.sh -daemon
      -host 0.0.0.0
      -port 8080
      -config api.key=${ZAP_API_KEY:-securescan-dev-key-2024}
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config scanner.antiCSRF.tokenNames=csrf_token,_token,user_token
      -config scanner.exclude=.*User.Agent.*
      -config rules.disableIds=10104
      -config spider.thread=5
      -config scanner.threadPerHost=3
    networks:
      - securescan-net
      - lab-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/JSON/core/view/version/?apikey=${ZAP_API_KEY:-securescan-dev-key-2024}"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  # ── SQLMap API ───────────────────────────────────────────────────────
  # BUG FIX: usar la misma imagen construida para 'api' en vez de rebuild
  sqlmapapi:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: securescan-sqlmapapi
    command: ["python3", "/opt/sqlmap/sqlmapapi.py", "-s", "-H", "0.0.0.0", "-p", "8775", "--username", "scanner", "--password", "${SQLMAP_API_PASSWORD:-sqlmapsecret}"]
    ports:
      - "127.0.0.1:8775:8775"
    networks:
      - securescan-net
      - lab-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "-u", "scanner:${SQLMAP_API_PASSWORD:-sqlmapsecret}", "-o", "/dev/null", "http://localhost:8775/task/new"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ── OWASP Juice Shop ─────────────────────────────────────────────────
  juice-shop:
    image: bkimminich/juice-shop:v17.0.0
    container_name: juice-shop
    ports:
      - "3001:3000"
    volumes:
      - juice-shop-data:/data
    networks:
      - lab-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e",
             "require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ── DVWA ─────────────────────────────────────────────────────────────
  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    container_name: dvwa
    ports:
      - "3002:80"
    environment:
      - DB_SERVER=dvwa-db
      - DB_DATABASE=${MYSQL_DATABASE:-dvwa}
      - DB_USERNAME=${MYSQL_USER:-dvwa}
      - DB_PASSWORD=${MYSQL_PASSWORD:-p@ssw0rd}
      - DB_PORT=3306
    depends_on:
      dvwa-db:
        condition: service_healthy
    networks:
      - lab-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 5

  # ── DVWA Database ─────────────────────────────────────────────────────
  dvwa-db:
    image: mariadb:10.11
    container_name: dvwa-db
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-dvwa}
      - MYSQL_USER=${MYSQL_USER:-dvwa}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-p@ssw0rd}
    volumes:
      - dvwa-db-data:/var/lib/mysql
    networks:
      - lab-net
    restart: unless-stopped
    healthcheck:
      # BUG FIX: usar variable de entorno en vez de contraseña hardcodeada
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost",
             "-u", "${MYSQL_USER:-dvwa}", "-p${MYSQL_PASSWORD:-p@ssw0rd}"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ── WebGoat ───────────────────────────────────────────────────────────
  webgoat:
    image: webgoat/webgoat:latest
    container_name: webgoat
    ports:
      - "3003:8080"
    environment:
      - TZ=America/Bogota
      - WEBGOAT_PORT=8080
      - WEBGOAT_SSLENABLED=false
    volumes:
      - webgoat-data:/home/webgoat/.webgoat
    networks:
      - lab-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/WebGoat/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  # ── Metasploit RPC daemon ─────────────────────────────────────────────
  msfrpcd:
    image: metasploitframework/metasploit-framework:latest
    container_name: securescan-msfrpcd
    entrypoint: ["bash", "-c"]
    command:
      - "/usr/src/metasploit-framework/msfrpcd -P ${MSF_PASSWORD:-msf} -S -a 0.0.0.0 -p 55553 -f"
    environment:
      - MSF_PASSWORD=${MSF_PASSWORD:-msf}
    ports:
      - "55553:55553"
    volumes:
      - msf-data:/root/.msf4
    networks:
      - securescan-net
      - lab-net
    cap_add:
      - NET_RAW
      - NET_ADMIN
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/55553"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 10

# ── Redes ─────────────────────────────────────────────────────────────────────
networks:
  securescan-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  lab-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

# ── Volúmenes ─────────────────────────────────────────────────────────────────
volumes:
  redis-data:
  scan-reports:
  dvwa-db-data:
  msf-data:
  nuclei-templates:
  juice-shop-data:
  webgoat-data:
